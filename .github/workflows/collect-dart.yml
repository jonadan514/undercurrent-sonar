name: Collect DART

# 분기 재설계(docs/REDESIGN_SPEC.md 4-1). 한국 분기 재무와 사업정보 보강을 DART에서 받는다.
# DART_API_KEY는 저장소 Secrets에 둔다.
# 2026-10-09: 매주 토요일 워치리스트 종목 분기 재무 자동 갱신(mode=watchlist, 올해·작년 보고서) - 최근 4개 분기 합 비교용.
on:
  schedule:
    # 토요일 09:00 UTC (18:00 KST). 처음엔 21:00 UTC였는데 예약이 3시간 밀려 일요일 09:00 KST에 돌았고,
    # 그때 DART가 121종목 전부 비JSON 응답(점검 시간대로 보임, 10/11). 같은 시각 토요일 오후 수동 실행은 정상(10/17).
    - cron: "0 9 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "sample(몇 종목 표로 확인) / financials(유니버스 전체 재무) / watchlist(워치리스트 종목 재무) / profiles(사업정보 없는 종목 보강) / profiles-refresh(DART로 채운 것 다시 받기)"
        required: true
        default: "sample"
      tickers:
        description: "sample 모드 종목코드 공백 구분"
        required: false
        default: "005930 086520 000660 064760 036930"
      offset:
        description: "financials 모드 - 유니버스 정렬 순서에서 이만큼 건너뛴다 (구간 실행용)"
        required: false
        default: "0"
      years:
        description: "financials·watchlist 모드 - 받을 사업연도 수(연속 8분기에는 3)"
        required: false
        default: "2"
      limit:
        description: "financials 모드 - offset부터 몇 종목만 (비우면 끝까지, 664종목 전체는 약 173분 예상 - 180분 제한에 거의 닿아 구간을 나누는 걸 권장)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ inputs.mode || 'watchlist' }}" in
            watchlist)
              python scripts/collect_kr_quarterly_financials.py --watchlist --years ${{ inputs.years || '2' }} ;;
            sample)
              python scripts/collect_kr_quarterly_financials.py --tickers ${{ inputs.tickers }}
              python scripts/fill_kr_profiles_from_dart.py --tickers ${{ inputs.tickers }} ;;
            financials)
              if [ -n "${{ inputs.limit }}" ]; then
                python scripts/collect_kr_quarterly_financials.py --offset ${{ inputs.offset }} --limit ${{ inputs.limit }}
              else
                python scripts/collect_kr_quarterly_financials.py --offset ${{ inputs.offset }}
              fi ;;
            profiles)
              python scripts/fill_kr_profiles_from_dart.py ;;
            profiles-refresh)
              python scripts/fill_kr_profiles_from_dart.py --refresh-dart ;;
            *) echo "알 수 없는 mode"; exit 1 ;;
          esac
      # 사업정보 보강 결과와 기업코드 캐시(+ 수집 시각을 적은 메타 파일)를 저장소에 남긴다.
      # 메타 파일이 없으면 캐시를 늘 오래된 것으로 보고 매번 corpCode.zip을 다시 받는다.
      # (sample은 확인용이라 커밋하지 않음)
      - name: Commit profiles
        if: startsWith(inputs.mode, 'profiles')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kr_profiles.json data/dart_corp_codes.json data/dart_corp_codes_meta.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: DART로 한국 사업정보 보강"
          git pull --rebase --autostash
          git push
