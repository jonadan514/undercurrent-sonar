name: Collect KR News Intraday

# 한국 테마 뉴스를 나눠 쌓는다(2026-11-10) - 네이버는 키워드당 최신 약 1000건까지만 읽혀서 주 1회로는 기사가 많은 테마를
# 다 못 셌다(src/collectors/kr_news_intraday.py).
#
# 2026-11-17 '이어 도는' 방식으로 바꿈(사용자 결정). 4시간·매시간 예약 모두 GitHub가 하루 2~3번만 실제로 돌려(11/16: 09:56·20:33 UTC,
# 직전 실행과 13시간) 평일마다 'AI 반도체'·'인프라 투자'가 상한에 걸려 그 테마·주가 데이터부족이 됐다. 이제 한 실행이 약 5시간
# 20분 동안 40분마다 수집하고, 끝나면 다음 실행을 직접 띄운다(workflow_dispatch - GITHUB_TOKEN으로 띄울 수 있는 유일한 종류).
# 예약은 이어 돌기가 끊겼을 때 다시 시작시키는 용도로만 남긴다 - 돌고 있는 동안 예약이 오면 대기열에 섰다가 다음 실행에 밀려 취소된다
# (같은 concurrency 묶음은 대기 1개만).
#
# 같은 차례에 차트 상태(scripts/compute_price_facts.py --if-stale)도 부른다 - 미국 장 마감 뒤 값이 없을 때만 실제로 받는다
# (price-facts.yml 평일 예약도 11/16에 돌지 않았다).
#
# 월요일 주간 뉴스 계산(collect-theme-news, concurrency kr-news-state)과 겹쳐 돌 수 있다 - 둘 다 news_fetch_state를 쓰지만
# 저장은 테마·URL 중복이 막고, 읽은 시점(last_seen)은 뒤로 가지 않게 저장한다. 이 묶음을 같이 쓰면 주간 계산이 5시간 넘게 기다리거나
# 대기열에서 취소될 수 있어 따로 둔다.
on:
  schedule:
    - cron: "20 */3 * * *"   # 끊겼을 때 다시 시작용(돌고 있으면 대기 → 다음 실행에 밀려 취소)
  workflow_dispatch:
    inputs:
      once:
        description: "true면 한 번만 수집하고 끝(다음 실행을 띄우지 않음) - 점검용"
        required: false
        type: boolean
        default: false

concurrency:
  group: kr-news-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: write        # 끝날 때 다음 실행 띄우기

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect every 40 minutes
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
          ONCE: ${{ inputs.once && '1' || '' }}
        run: |
          LOOP_SEC=$((5*3600 + 20*60))   # 이 실행이 수집하는 시간(작업 제한 350분 안)
          GAP_SEC=2400                    # 차례 사이 40분(시작 기준)
          fails=0; n=0
          while :; do
            start=$SECONDS; n=$((n+1))
            echo "::group::차례 $n $(date -u +%H:%M) UTC"
            if python scripts/collect_kr_news_intraday.py; then fails=0; else fails=$((fails+1)); echo "수집 실패 $fails번 연속"; fi
            python scripts/compute_price_facts.py --if-stale && python scripts/compute_decision_outcomes.py || echo "차트 상태 계산 실패 - 다음 차례에 다시"
            echo "::endgroup::"
            # 세 번 연속 실패면 이 실행을 실패로 끝내 알림이 가게 한다(다음 실행은 그래도 띄운다)
            if [ $fails -ge 3 ]; then exit 1; fi
            if [ -n "$ONCE" ]; then break; fi
            next=$((start + GAP_SEC))
            if [ $next -ge $LOOP_SEC ]; then break; fi
            sleep $((next - SECONDS > 60 ? next - SECONDS : 60))
          done
      # 다음 실행 띄우기 - 취소된 실행(사람이 멈춘 것)과 점검용 한 번 실행은 이어 가지 않는다
      - name: Start next run
        if: ${{ !cancelled() && !inputs.once }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-kr-news-intraday.yml --ref "${{ github.ref_name }}"
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
