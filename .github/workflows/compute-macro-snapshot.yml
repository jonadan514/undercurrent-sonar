name: Compute Macro Snapshot

on:
  schedule:
    # 매일 22:30 UTC (미국 정규장 마감 이후) - 주말엔 그냥 금요일 종가가 그대로 나옴
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install yfinance pandas
      - env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: python -m src.analyzers.macro_snapshot

      # 국고채 금리(주간 브리핑 금리·환율 줄) - pykrx는 pandas<3.0이 필요해 격리 환경에서 받는다(워치리스트와 같은 방식).
      # 실패해도 거시 스냅샷은 이미 저장됐다.
      - name: Fetch KR treasury yields (isolated pykrx)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m venv /tmp/krxenv
          /tmp/krxenv/bin/pip install --quiet "pandas<3.0" "pykrx==1.2.8"
          /tmp/krxenv/bin/python scripts/fetch_kr_treasury_pykrx.py --out data/kr_treasury.json
      # 코스피·코스닥 투자자별 순매수(2026-10-17, 주간 브리핑 수급) - 같은 격리 환경을 그대로 쓴다.
      - name: Fetch KR investor flows (isolated pykrx)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: |
          [ -x /tmp/krxenv/bin/python ] || { python -m venv /tmp/krxenv && /tmp/krxenv/bin/pip install --quiet "pandas<3.0" "pykrx==1.2.8"; }
          /tmp/krxenv/bin/python scripts/fetch_kr_investor_flows_pykrx.py --out data/kr_investor_flows.json
      - name: Save KR treasury yields
        if: always()
        continue-on-error: true
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: |
          pip install --quiet requests
          python scripts/save_kr_treasury.py --in data/kr_treasury.json
      - name: Save KR investor flows
        if: always()
        continue-on-error: true
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: |
          pip install --quiet requests
          python scripts/save_kr_investor_flows.py --in data/kr_investor_flows.json
      # 정기 실행이 실패하면 텔레그램으로 알린다(2026-10-17) - 수동 실행은 보는 사람이 있어 알리지 않는다.
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
