name: Generate Company Summaries KO

# 기업 카드 사업 요약 한국어판(2026-11-05) - companyProfiles.json 영문 원문 중 아직 옮기지 않은 것만 gpt-4o-mini로.
# 처음 한 번 약 0.3달러, 그 뒤엔 프로필 파일을 다시 만들어 바뀐 종목만. 매달 1일 한 번 + 수동.
on:
  schedule:
    - cron: "17 20 1 * *"   # 매달 1일 20:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "이만큼만(시험, 비우면 전부)"
        required: false
        default: ""
      dry_run:
        description: "true면 묻지 않고 건수만"
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Generate
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=()
          [ -n "${{ inputs.limit }}" ] && ARGS+=(--limit ${{ inputs.limit }})
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          python scripts/gen_company_summaries_ko.py "${ARGS[@]}"
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
