name: Weekly Market Analysis

on:
  schedule:
    # 매주 월요일 22:00 UTC (화요일 07:00 KST) — 전날(일요일) 워치리스트 스크리닝 다음날
    - cron: '0 22 * * 1'
  workflow_dispatch:           # 수동 실행 (모든 잡 실행)

env:
  TURSO_DATA_URL:      ${{ secrets.TURSO_DATA_URL }}
  TURSO_DATA_TOKEN:    ${{ secrets.TURSO_DATA_TOKEN }}
  FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
  FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
  OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
  PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}
  TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 선택 — 미설정 시 알림만 건너뜀
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

# 종목별 AI 요약(비용이 드는 부분)은 이제 주간 워치리스트 스크리닝 쪽(narratives 잡)으로
# 옮겨갔으므로, 여기서는 US/KR을 같은 크론에서 동시에 실행해도 비용 부담이 없다.
jobs:
  us-analysis:
    name: US Market Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run US analysis
        run: python scripts/run_integrated_analysis.py

  kr-analysis:
    name: KR Market Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # KRX 공식 섹터 지수(코스피200 섹터지수 + 유틸리티 업종지수)를 받아 둔다.
      # pykrx 1.2.8이 pandas<3.0을 요구해(본 저장소는 pandas 3.x) 격리 venv에서
      # 따로 돈다 - weekly-watchlist.yml의 KR 유니버스 수집과 같은 사정
      # (docs/SPEC_kr_sector_index.md 3장). 이 단계가 실패해도(KRX 로그인 만료,
      # KRX 점검 등) KR 분석 자체는 앵커 종목 폴백으로 계속 돌아야 하므로
      # continue-on-error로 이 단계의 실패가 잡 전체를 막지 않게 한다.
      - name: Fetch KRX sector index (isolated venv)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m venv /tmp/krxenv
          /tmp/krxenv/bin/pip install --quiet "pandas<3.0" "pykrx==1.2.8"
          /tmp/krxenv/bin/python scripts/fetch_krx_sector_index.py --out /tmp/krx_sector_index.json || echo "KRX 섹터 지수 수집 실패 - 앵커 폴백으로 계속"

      - name: Run KR analysis
        env:
          KRX_SECTOR_INDEX_JSON: /tmp/krx_sector_index.json
        run: python scripts/run_kr_analysis.py

  # telegram-digest(화요일 주간 요약 - 관심도 상승·내 워치리스트 교차)는 2026-11-05 뺐다. 같은 내용이 월요일 주간 브리핑 텔레그램에 다 있다.

  notify-failure:
    name: Notify on Failure
    needs: [us-analysis, kr-analysis]
    if: failure()   # needs 잡 중 하나라도 실패하면 실행 (스킵된 잡은 실패로 안 침)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Send failure notification
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: >-
            us-analysis=${{ needs['us-analysis'].result }},
            kr-analysis=${{ needs['kr-analysis'].result }}
        run: python scripts/notify_failure.py
