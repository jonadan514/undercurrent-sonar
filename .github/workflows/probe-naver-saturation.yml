name: Probe Naver Saturation

# 네이버 뉴스 상한 실측(읽기 전용, DB에 쓰지 않음). scripts/probe_naver_saturation.py
on:
  workflow_dispatch:
    inputs:
      themes:
        description: "테마 ID 공백 구분 (비우면 전체)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
          THEMES: ${{ inputs.themes }}
        run: python scripts/probe_naver_saturation.py ${THEMES:+--themes $THEMES}
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-probe
          path: out/naver_probe.json
          if-no-files-found: warn
