name: Collect US Quarterly Financials

# 분기 재설계(docs/REDESIGN_SPEC.md 4-1). 미국 분기 재무를 yfinance에서 받는다.
# 한국(collect-dart.yml)과 짝이지만 API가 달라 별도 워크플로다.
on:
  # 매주 유니버스 전체를 다시 받는다 - 새 분기 실적(10-Q)이 들어오고, 바뀐 분기만 저장된다.
  # 토요일 18:00 UTC: 같은 yfinance를 쓰는 backfill-quarterly-financials(21:00)와 겹치지 않게,
  # 일요일 밤 워치리스트 스크리닝(22:00, PSR 재계산) 전에 끝나게.
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "sample(몇 종목 표로 확인) / financials(유니버스 구간 실행) / missing(표에 없는 종목만)"
        required: true
        default: "sample"
      tickers:
        description: "sample 모드 종목코드 공백 구분"
        required: false
        default: "AAPL MSFT NVDA TSLA GME"
      offset:
        description: "financials 모드 - 유니버스 정렬 순서에서 이만큼 건너뛴다"
        required: false
        default: "0"
      limit:
        description: "financials 모드 - offset부터 몇 종목만 (비우면 끝까지)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          # 정기 실행은 inputs가 비어 있다 - 유니버스 전체(financials)로 돈다.
          case "${{ inputs.mode || 'financials' }}" in
            sample)
              python scripts/collect_us_quarterly_financials.py --tickers ${{ inputs.tickers }} ;;
            financials)
              if [ -n "${{ inputs.limit }}" ]; then
                python scripts/collect_us_quarterly_financials.py --offset ${{ inputs.offset || '0' }} --limit ${{ inputs.limit }}
              else
                python scripts/collect_us_quarterly_financials.py --offset ${{ inputs.offset || '0' }}
              fi ;;
            missing)
              python scripts/collect_us_quarterly_financials.py --only-missing ;;
            *) echo "알 수 없는 mode"; exit 1 ;;
          esac
      # 정기 실행이 실패하면 텔레그램으로 알린다(2026-10-17) - 수동 실행은 보는 사람이 있어 알리지 않는다.
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
