name: Preview Briefing Comment

# 읽기 전용(2026-11-02) - 저장된 최근 주간 브리핑으로 GPT 총평만 만들어 로그에 출력. 저장·텔레그램 발송 없음.
# full=1(2026-11-05)이면 지금 데이터로 브리핑 전체를 만들어 칸별 건수·총평·텔레그램 본문을 출력(--dry-run, 스냅샷 저장도 안 함).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "총평 모델 바꿔 보기(비우면 config/models.yaml의 briefing_comment)"
        required: false
        default: ""
      telegram:
        description: "텔레그램 본문도 출력(1이면)"
        required: false
        default: "1"
      full:
        description: "1이면 지금 데이터로 브리핑 전체 미리 보기(저장·발송 없음)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install requests yfinance pyyaml
      - name: Preview
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MODEL_BRIEFING_COMMENT: ${{ inputs.model }}
          PREVIEW_TELEGRAM: ${{ inputs.telegram }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/generate_weekly_briefing.py ${{ inputs.full == '1' && '--dry-run' || '--preview-comment' }}
