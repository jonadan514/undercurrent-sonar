name: Performance Tracking

on:
  schedule:
    - cron: '0 23 * * 0'   # 매주 일요일 23:00 UTC (weekly-watchlist 다음 시간대)
  workflow_dispatch:         # 수동 실행
    inputs:
      backfill_weeks:
        description: "신호 기록: 지난 몇 주도 원본 표에서 다시 만든다(소급, 처음 한 번 8)"
        required: false
        default: "0"

jobs:
  compute-returns:
    name: Compute Pick Returns
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compute pick returns (US + KR)
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: python scripts/compute_pick_returns.py --market ALL

  # 신호 사후 확인(2026-10-21) - 그 주 신호(내부자 매수·실적 반전 새로·공시 평소보다 많은 테마)를 적고, 4·12주 지난 신호의 결과를 채운다.
  # 브리핑(22:00) 뒤라 그 주 실적 반전 스냅샷이 있다.
  signal-check:
    name: Log Signals and Outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Log this week's signals
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
          BACKFILL: ${{ inputs.backfill_weeks || '0' }}
        run: python scripts/log_signals.py --backfill-weeks "$BACKFILL"
      - name: Compute signal outcomes
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/compute_signal_outcomes.py

  notify-failure:
    name: Notify on Failure
    needs: [compute-returns, signal-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Send failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: >-
            compute-returns=${{ needs['compute-returns'].result }}
            signal-check=${{ needs['signal-check'].result }}
        run: python scripts/notify_failure.py
