name: Performance Tracking

on:
  # 주간 워치리스트(스크리닝 → 네러티브 → 브리핑)가 끝나면 바로 돈다(2026-10-26). 예전 일요일 23:00 UTC 예약은 예약 실행이 제각각
  # 늦게 시작돼 네러티브보다 먼저 돌곤 해서 그 주 관심도 상승 신호가 빠졌다(10/26: 신호 기록 00:59, 네러티브 끝 01:13).
  # 워치리스트가 실패해도(completed) 돈다 - 지난 신호의 결과 채우기는 워치리스트와 상관없다.
  workflow_run:
    workflows: ["Weekly Watchlist Screen"]
    types: [completed]
  workflow_dispatch:         # 수동 실행
    inputs:
      backfill_weeks:
        description: "신호 기록: 지난 몇 주도 원본 표에서 다시 만든다(소급, 처음 한 번 8). 기본 1 = 지난주에 빠진 것만 채움"
        required: false
        default: "1"

jobs:
  compute-returns:
    name: Compute Pick Returns
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compute pick returns (US + KR)
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: python scripts/compute_pick_returns.py --market ALL

  # 신호 사후 확인(2026-10-21) - 그 주 신호(내부자 매수·실적 반전 새로·공시 평소보다 많은 테마)를 적고, 4·12주 지난 신호의 결과를 채운다.
  # 워치리스트·브리핑 뒤라 그 주 실적 반전 스냅샷·관심도 기록이 있다.
  signal-check:
    name: Log Signals and Outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Log this week's signals
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
          # 정기 실행도 지난주를 한 번 더 훑는다(10/21 리뷰): 예약 실행이 제각각 몇 시간씩 늦게 시작돼 이 작업이 브리핑(22:00)보다
          # 먼저 돌면 그 주 실적 반전 스냅샷이 없어 '실적 반전 새로'가 빠진다 - 다음 주에 빠진 것만 채운다(이미 적힌 줄은 그대로, 늦게 적힌 줄은 소급 표시).
          BACKFILL: ${{ inputs.backfill_weeks || '1' }}
        run: python scripts/log_signals.py --backfill-weeks "$BACKFILL"
      - name: Compute signal outcomes
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/compute_signal_outcomes.py

  notify-failure:
    name: Notify on Failure
    needs: [compute-returns, signal-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Send failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: >-
            compute-returns=${{ needs['compute-returns'].result }}
            signal-check=${{ needs['signal-check'].result }}
        run: python scripts/notify_failure.py
