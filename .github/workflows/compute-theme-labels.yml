name: Compute Theme Labels

on:
  schedule:
    - cron: "45 22 * * 0"   # 뉴스(22:00)·실적(22:15)·주가(22:30) 전부 끝난 뒤 - SPEC §7
  workflow_dispatch:
    inputs:
      week_start:
        description: "기준 주 월요일 YYYY-MM-DD (비우면 오늘이 속한 주)"
        required: false
        default: ""

jobs:
  compute:
    name: Compute labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute labels
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: python scripts/compute_theme_labels.py --week-start "${{ inputs.week_start }}"

      # 관찰 노트 회고 - 라벨까지 끝난 같은 주 값으로 4주·12주 회고를 붙인다 (실패해도 라벨은 이미 저장됨)
      - name: Review observations
        if: always()
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: python scripts/review_observations.py
      # 정기 실행이 실패하면 텔레그램으로 알린다(2026-10-17) - 수동 실행은 보는 사람이 있어 알리지 않는다.
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
