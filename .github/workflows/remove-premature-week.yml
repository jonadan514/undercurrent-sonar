name: Remove Premature Week Signals

# 아직 진행 중인 주에 정기 실행보다 먼저 생긴 theme_signals·theme_member_signals 행(주가·라벨 없음)을 지운다(멱등).
# 11-05 진단용 정리 때 지웠다가 같은 날 실적 축 수동 실행 사고로 되살림.
# 기본값은 dry_run=true - 무엇이 지워지는지 로그로 먼저 본다.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "지울 주의 월요일 (YYYY-MM-DD)"
        required: true
      dry_run:
        description: "true면 바꾸지 않고 대상만 출력"
        required: false
        default: "true"

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Remove
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=(--week "${{ inputs.week }}")
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          python scripts/remove_premature_week_signals.py "${ARGS[@]}"
