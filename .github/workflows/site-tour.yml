name: Site Tour

# 읽기 전용(2026-11-05) - 사이트 페이지를 차례로 열어 섹션 머리·빈 칸/오류 문구·콘솔 오류·실패한 API 요청을 로그로 찍는다.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "쉼표로 구분한 경로(비우면 기본 목록). 예: /company?stock=US:MU,/company?stock=KR:005930"
        required: false
        default: ""
      dump:
        description: "true면 페이지 본문 글자를 그대로 찍는다"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-24.04   # Playwright 브라우저가 ubuntu-latest(26.04)를 아직 지원하지 않는다(2026-11-05)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/tools/site_tour.mjs
        env:
          PAGES: ${{ inputs.pages }}
          DUMP: ${{ inputs.dump && '1' || '' }}
