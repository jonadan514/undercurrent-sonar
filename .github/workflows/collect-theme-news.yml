name: Collect Theme News

on:
  schedule:
    - cron: "0 22 * * 0"   # 매주 일요일 22:00 UTC (월요일 07:00 KST) - SPEC §7
  workflow_dispatch:
    inputs:
      weeks_back:
        description: "처리할 주 수 (1=이번 주만, 8=콜드스타트 백필)"
        required: false
        default: "1"
      theme_id:
        description: "테마 ID 공백 구분 (비우면 전체)"
        required: false
        default: ""
      market:
        description: "US 또는 KR (비우면 둘 다)"
        required: false
        default: ""
      recalc_relative_week:
        description: "수집 없이 이 주(월요일 YYYY-MM-DD)의 미국 뉴스 화살표만 시장 대비로 다시 판정 (보통 비움)"
        required: false
        default: ""

# 한국 하루 세 번 수집(collect-kr-news-intraday)과 같은 상태 표를 쓴다 - 동시에 돌지 않게.
concurrency:
  group: kr-news-state
  cancel-in-progress: false

jobs:
  collect:
    name: Collect theme news
    runs-on: ubuntu-latest
    # 백필(weeks_back=8)은 테마당 키워드별로 요청 사이 1초씩 쉬므로 시간이 걸림
    # 두 시장 전체가 69분(2026-10-01)에서 90분 초과(2026-10-02)까지 걸렸다. 90분에 걸려 취소되면
    # 저장 단계까지 못 가서 그 주 데이터가 통째로 사라진다 - 여유를 크게 둔다.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          # 한국 수집 소스. 둘 다 있으면 네이버 뉴스 API를 쓰고, 없으면 구글 RSS로
          # 돌아간다(2026-09-28 구글이 Actions IP를 막은 뒤 추가한 대체 경로).
          # 키를 빼는 것만으로 즉시 원복된다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # 전 테마 0건이면 텔레그램 경고를 보낸다(조용히 깨지는 것을 막는다).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET: ${{ inputs.market }}
          RECALC_WEEK: ${{ inputs.recalc_relative_week }}
        run: >
          python scripts/collect_theme_news.py
          --weeks-back "${{ inputs.weeks_back || '1' }}"
          ${MARKET:+--market "$MARKET"}
          ${RECALC_WEEK:+--recalc-relative "$RECALC_WEEK"}
          --theme-id ${{ inputs.theme_id }}
      # 정기 실행이 실패하면 텔레그램으로 알린다(2026-10-17) - 수동 실행은 보는 사람이 있어 알리지 않는다.
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
