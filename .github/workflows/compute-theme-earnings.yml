name: Compute Theme Earnings

on:
  schedule:
    - cron: "15 22 * * 0"   # 뉴스 수집(22:00)과 살짝 겹치지 않게 15분 뒤 - SPEC §7
  workflow_dispatch:
    inputs:
      week_start:
        description: "기준 주 월요일 YYYY-MM-DD (비우면 일·월은 방금 끝난 주, 주 중간은 이미 있는 최신 주)"
        required: false
        default: ""
      theme_id:
        description: "테마 ID 공백 구분 (비우면 전체)"
        required: false
        default: ""
      include_peripheral:
        description: "linkage=peripheral도 포함할지"
        required: false
        type: boolean
        default: false
      peer_metrics_only:
        description: "업종 동료 비교용 유니버스 값만 쓰기(테마 실적 축은 그대로) - 서프라이즈 수집도 건너뜀"
        required: false
        type: boolean
        default: false
      surprise_budget:
        description: "실적 서프라이즈를 새로 조회할 종목 수 (비우면 150, 0이면 수집 건너뜀)"
        required: false
        default: ""

jobs:
  compute:
    name: Compute earnings axis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 실적 발표 서프라이즈(참고 수치) 수집. 종목별 호출이라 예산제로 나눠 받는다 -
      # 실패해도 실적 축 계산은 그대로 진행한다(서프라이즈만 비어 있게 된다).
      - name: Collect earnings surprise
        continue-on-error: true
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          BUDGET="${{ inputs.surprise_budget }}"
          if [ "$BUDGET" = "0" ] || [ "${{ inputs.peer_metrics_only }}" = "true" ]; then echo "수집 건너뜀"; exit 0; fi
          python scripts/collect_earnings_surprise.py ${BUDGET:+--budget "$BUDGET"}

      # boolean 입력은 문자열 'true'와 비교하면 늘 거짓이다(2026-11-11 peer_metrics_only가 안 넘어가 테마 계산까지 돌았다) - 값 그대로 쓴다
      - name: Compute
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: >
          python scripts/compute_theme_earnings.py --week-start "${{ inputs.week_start }}"
          --theme-id ${{ inputs.theme_id }}
          ${{ inputs.include_peripheral && '--include-peripheral' || '' }}
          ${{ inputs.peer_metrics_only && '--peer-metrics-only' || '' }}
      # 정기 실행이 실패하면 텔레그램으로 알린다(2026-10-17) - 수동 실행은 보는 사람이 있어 알리지 않는다.
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
