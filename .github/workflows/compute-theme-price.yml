name: Compute Theme Price

on:
  schedule:
    - cron: "30 22 * * 0"   # 뉴스(22:00)·실적(22:15) 다음, 15분 더 띄움 - SPEC §7
  workflow_dispatch:
    inputs:
      week_start:
        description: "기준 주 월요일 YYYY-MM-DD (비우면 오늘이 속한 주)"
        required: false
        default: ""
      theme_id:
        description: "테마 ID 공백 구분 (비우면 전체)"
        required: false
        default: ""
      include_peripheral:
        description: "linkage=peripheral도 포함할지"
        required: false
        type: boolean
        default: false

jobs:
  compute:
    name: Compute price axis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: >
          python scripts/compute_theme_price.py --week-start "${{ inputs.week_start }}"
          --theme-id ${{ inputs.theme_id }}
          ${{ inputs.include_peripheral == 'true' && '--include-peripheral' || '' }}
      # 정기 실행이 실패하면 텔레그램으로 알린다(2026-10-17) - 수동 실행은 보는 사람이 있어 알리지 않는다.
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ github.job }}=failure
        run: python scripts/notify_failure.py
