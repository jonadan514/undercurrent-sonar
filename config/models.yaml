# LLM 모델 설정 (작업지시서 Phase 5)
#
# 역할마다 모델을 따로 고를 수 있다. 매핑 모델과 감사 모델을 독립적으로 바꿔 비교하기 위함
# (예: 매핑은 o4-mini, 감사는 gpt-4o-mini). 같은 모델이 만들고 같은 모델이 검증하면
# 같은 실수를 공유할 위험이 있다.
#
# 우선순위: 환경변수 MODEL_<ROLE 대문자>  >  이 파일  >  기본값(gpt-4o-mini)
#   예: MODEL_THEME_MAPPING=o4-mini python scripts/map_theme_companies.py ...
#
# **아직 기본 모델을 바꾸지 않는다.** 2026-09-16 A/B(미국 5개 테마)에서 o4-mini가 가장 좋았지만
# (정답 18/18, 알려진 오답 2건) 호출당 10초로 현행의 6배라 전체 매핑이 워크플로 제한(150분)을
# 넘는다. 이번 작업은 "교체 가능한 구조"까지이고, 실제 전환은 별도 커밋에서 한다.
#
# 모델 계열별 요청 형식 차이(o-시리즈·gpt-5는 temperature 금지)는 src/llm/openai_json.py가 처리한다.

theme_mapping:        # 후보 생성: 경로 A(유니버스 제약) + 경로 B(자유 생성)
  model: gpt-4o-mini

mapping_critic:       # 1차 통과 목록의 약한 근거를 지적하는 비판 패스
  model: gpt-4o-mini

mapping_audit:        # 근거 감사: 근거가 사실인가 / 테마에 맞는가
  model: gpt-4o-mini

mapping_requote:      # 인용 검증에 실패한 건의 원문 문구 재질의
  model: gpt-4o-mini

briefing_comment:     # 주간 브리핑 총평 '이번 주 짚을 점' 서술(주 1회 한 번 호출, 2026-11-02)
  # 11/2 데이터로 비교: gpt-4o-mini는 없는 사실을 지어냄("한국 석유화학은 뉴스가 늘지 않았다" - 한국 노트는 없었다),
  # gpt-4o는 사실만 씀. 주 1회 한 번이라 비용 차이는 작다(한 번에 1~2센트 안팎).
  model: gpt-4o

value_chain:          # 소속 기업을 themes.yaml 가치사슬 구간 번호에 배정(2026-11-05) - 테마·시장마다 한 번, 새 매핑만
  model: gpt-4o-mini
