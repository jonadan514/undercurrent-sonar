# 테마 소속 자동 점검(scripts/check_mapping_rules.py)의 "사업정보 근거" 규칙용 단어 목록.
#
# 기업의 사업정보(data/us_profiles.json·kr_profiles.json의 산업분류 + 긴 요약)에 아래 정규식 중
# 하나도 없으면 "사업정보에서 테마 근거를 못 찾음"으로 사람 검토에 올린다. 자동 제외가 아니다 -
# 요약이 짧거나 사업부 하나를 빠뜨린 경우가 있어서, 걸린 것은 사람이 본다.
#
# 원칙: 넓게 잡는다(빠뜨리는 것보다 덜 걸리는 게 낫다 - 이 규칙의 목적은 "근거가 전혀 없는" 소속을
# 찾는 것이다). 테마 정의(themes.yaml value_chain)의 편입 항목마다 영문·한글 표현을 하나 이상 둔다.
# 대소문자 무시. 2026-10-23 미국·한국 수작업 정의 대조(us_v8d·kr_v7d)와 판정 원장으로 채점해서 고른다.

