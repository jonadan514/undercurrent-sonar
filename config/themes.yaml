# 리서치 레이더 — 테마 정의
#
# 작성일: 2026-08-27
# 용도: 주간 뉴스 건수 집계와 테마→기업 매핑의 기준 목록
#
# ── 유지보수 규칙 ─────────────────────────────────────────
# 1. 테마를 뺄 때 삭제하지 말고 status: archived 로 바꾼다.
#    과거 데이터가 살아있어야 "작년에 뜨다가 식은 테마"를 볼 수 있다.
# 2. keywords 를 수정하면 keywords_changed_at 을 기록하고,
#    그 이전 데이터와는 추이를 잇지 않는다. (기준선이 바뀌므로)
# 3. 테마끼리 기업이 겹치는 것은 허용한다. 오히려 두 테마가
#    동시에 움직이면 강한 신호다.
# 4. 첫 실행 후 테마별 소속 기업 수를 반드시 확인한다.
#    3개 이하 → 상위 테마에 합침 / 50개 이상 → 쪼갬
#    목표 범위는 10-30개. 단, 유니버스에 그 사업을 하는 기업이 실제로 없어서 적은 경우는
#    합치지 않는다(2026-09-15 사용자 결정) - 그 시장은 소속 5종목 미만이라 실적·주가가
#    na로 표시되고, 그게 맞는 표시다. 이걸 채우려고 유니버스를 넓히지 않는다.
#    예: 미국 조선(HII만)·구리(FCX만)·게임(EA·TTWO) - S&P500에 해당 기업이 그것뿐이다.
# 5. value_chain 은 테마→기업 매핑 프롬프트에 들어가는 정의다(SPEC_theme_company_mapping §3.1).
#    편입 단계와 "편입하지 않음" 경계를 함께 적는다. note 는 운영 메모라 프롬프트에 넣지 않는다.
#    (2026-09-15 이전에는 note가 정의 대신 프롬프트에 들어갔고, 대부분 "한국 전용." 같은 메모였다)
# 6. 에너지 테마(전력망·원전·재생에너지·ESS·가스·데이터센터 전력)는 그 사업이 주력인 전문 기업만
#    편입한다. 일반 규제 전력회사는 제외(2026-09-15 사용자 결정). 경계가 없을 때 같은 프롬프트로도
#    실행마다 유틸리티 편입이 뒤집혔다(v6는 AEP·DUK를 넣고 SO·XEL을 뺐고 v7은 15곳을 넣었다).
# ──────────────────────────────────────────────────────────

config:
  # 뉴스 건수가 이 값 미만이면 변화율을 계산하지 않고 판정 보류.
  # 기사 3건 → 6건도 +100%가 되어버리는 문제를 막는다.
  default_min_articles: 10

  # 뉴스 축 판정 구간 (이번 주 건수 / 직전 8주 중앙값)
  # 2026-09-16: 4주 평균 -> 8주 중앙값. 한 주 급증이 그다음 4주 기준선을 통째로 올려
  # 정작 테마가 달아오를 때 화살표가 죽는 문제를 막는다(중앙값은 급증 주를 한 표로만 센다).
  news_thresholds:
    strong_up: 2.0    # ↑↑  +100% 이상
    up: 1.3           # ↑   +30% 이상
    down: 0.7         # ↓   -30% 이하

  # 실적 축 판정 구간 (소속 기업 중 매출 성장률이 직전 분기보다 개선된 비율)
  earnings_thresholds:
    strong_up: 0.70
    up: 0.55
    down: 0.45

  # 주가 축: 소속 기업 4주 수익률 중앙값 - 시장 지수 4주 수익률
  # 시장 지수는 US=S&P500, KR=KOSPI 로 각각 비교
  price_thresholds:
    strong_up: 0.08   # +8%p 이상
    up: 0.03
    down: -0.03

themes:

