    markets: [US, KR]
    keywords_ko: [AI 반도체, HBM, AI 가속기, GPU 수요, 온디바이스 AI]
    keywords_en: [AI chip, AI accelerator, HBM memory, GPU demand, inference chip]
    status: active
    added_at: 2026-08-27
    value_chain: |
      AI 연산에 쓰이는 반도체와 그 전용 공급망.
      (1) AI 가속기·GPU·AI용 로직 칩 설계·제조
      (2) HBM 등 AI 서버용 고대역폭 메모리
      (3) HBM·첨단 패키징 후공정: 패키징, 번인·테스트 장비, 테스트 핸들러
          (반도체 장비·소재 테마와 동시 소속을 허용한다 - 2026-09-15 결정)
      (4) AI 칩용 기판(FC-BGA)
      편입하지 않음: OLED·디스플레이 장비, 장비 세정·코팅, 범용 장비 부품(석영·세라믹 파츠),
      범용 테스트 소켓처럼 AI 수요와 직접 연결되지 않는 일반 반도체 공급망(반도체 장비·소재 테마로).
