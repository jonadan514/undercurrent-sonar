# 이 파일의 테마 항목을 바꾸면 그 테마는 다음 실행 때 다시 분류된다(지문에 포함). 고친 이유를 옆에 적는다.
ai_semiconductor:
  US:
    AVGO: 1     # 맞춤형 AI 가속기(ASIC)·AI 네트워킹 칩 설계 - 매핑 근거 글이 '네트워킹·저장'뿐이라 GPT가 구간 밖으로 둠
defense:
  KR:
    "079550": 3 # LIG넥스원(2026 사명 변경) - 유도무기. 근거 글이 '방산 자재'뿐이라 구간 밖으로 분류됐다
    "012450": 1 # 한화에어로스페이스 - K9 자주포·레드백 등 지상 무기체계. 근거 글이 '항공기 엔진'뿐이라 실행마다 구간 밖/(1)이 갈렸다
